server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hungarian is the default locale and lives at the root. Legacy prefixed
    # URLs are redirected to it so that links keep working and stay canonical.
    location ~ ^/hu(/.*)?$ {
        return 301 /;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Custom chat: forward the widget's messages to the chat-backend service
    # (same Docker network) so the n8n webhook credential stays server-side.
    location /api/chat {
        proxy_pass http://172.31.255.4:3000/api/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # n8n workflows may think for a while before answering.
        proxy_read_timeout 90s;
    }

    # Serve the exported 404 page for unknown paths (status stays 404).
    error_page 404 /404.html;

    # Long-lived caching for hashed static assets.
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|woff2?|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
