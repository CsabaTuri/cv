# Behind the outer reverse proxy / Cloudflare tunnel TLS terminates outside, so
# the original scheme arrives in X-Forwarded-Proto. Keep it instead of the
# local $scheme (plain http) so the app sees the real protocol.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Chat API (visitor widget + admin inbox) on the chat-backend service.
    # The original URI is passed through unchanged.
    location /api/ {
        proxy_pass http://172.31.255.4:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
        # The chat endpoints are polled, never cache them.
        add_header Cache-Control "no-store";
    }

    # Serve the exported 404 page for unknown paths (status stays 404).
    error_page 404 /404.html;

    # Long-lived caching for hashed static assets.
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|woff2?|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
