# ---------------------------------------------------------------------------
# Static site + reverse proxy for the chat API.
# Runs as the non-root user of nginxinc/nginx-unprivileged (port 8080).
# ---------------------------------------------------------------------------

# Keep the real client scheme when TLS terminates at the outer proxy/tunnel.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Throttle the API: the widget polls a few times per minute per visitor, so
# 20 r/s per IP is far above the legitimate rate and stops floods.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the server version, keep request handling bounded.
    server_tokens off;
    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;

    include /etc/nginx/security-headers.conf;

    # Container healthcheck endpoint.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # -----------------------------------------------------------------------
    # Chat API (visitor widget + admin panel) -> chat-backend.
    #
    # The upstream is a variable so nginx resolves the service name through
    # Docker's DNS at request time: the backend can be recreated without
    # restarting this container, and no IP is hardcoded anywhere.
    # -----------------------------------------------------------------------
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $chat_backend http://chat-backend:3000;

        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;

        # The API is JSON over GET/POST/PUT only.
        if ($request_method !~ ^(GET|HEAD|POST|PUT|OPTIONS)$) {
            return 405;
        }

        proxy_pass $chat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # Do not leak the application server's fingerprint.
        proxy_hide_header X-Powered-By;

        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Serve the exported 404 page for unknown paths (status stays 404).
    error_page 404 /404.html;

    # Long-lived caching for hashed static assets.
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|woff2?|ttf|eot|webp|avif|pdf)$ {
        expires 1y;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
