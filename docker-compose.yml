services:

  # -------------------------------------------------------------------------
  # portfolio - static portfolio website (Next.js SSG, served by nginx).
  # Also serves /admin (the chat inbox) from the same static export.
  # Host port 3036.
  # -------------------------------------------------------------------------
  portfolio:
    build:
      context: ./portfolio
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN: ${NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN:-}
    container_name: portfolio
    restart: unless-stopped
    ports:
      - "3036:80"
    networks:
      exitnode-bridge:
        ipv4_address: 172.31.255.2

  # -------------------------------------------------------------------------
  # chat-backend - custom chat API + admin API.
  # Stores the conversations in MySQL, serves the visitor widget and the
  # /admin inbox. The site reaches it through the nginx /api/ proxy.
  # Host port 3112.
  # -------------------------------------------------------------------------
  chat-backend:
    build: ./chat-backend
    container_name: chat_backend
    restart: always
    ports:
      - "3112:3000"
    environment:
      - PORT=3000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      exitnode-bridge:
        ipv4_address: 172.31.255.4

  # -------------------------------------------------------------------------
  # mysql - chat message store (no host port, internal only).
  # -------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: chat_mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - TZ=${TZ:-Europe/Budapest}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      exitnode-bridge:
        ipv4_address: 172.31.255.5

  # -------------------------------------------------------------------------
  # phpmyadmin - web UI for the chat database.
  # Login with MYSQL_USER / MYSQL_PASSWORD (or MYSQL_ROOT_PASSWORD) from .env.
  # Host port 8081 (LAN only; do not expose it publicly).
  # -------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: chat_phpmyadmin
    restart: always
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - UPLOAD_LIMIT=64M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      exitnode-bridge:
        ipv4_address: 172.31.255.6

volumes:
  mysql-data:

networks:
  exitnode-bridge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.255.0/24
          gateway: "172.31.255.1"
