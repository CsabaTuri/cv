services:

  # -------------------------------------------------------------------------
  # portfolio - static portfolio website (Next.js SSG, served by nginx).
  # Built from ./portfolio. Host port 3036.
  # -------------------------------------------------------------------------
  portfolio:
    build:
      context: ./portfolio
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN: ${NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN:-}
        NEXT_PUBLIC_CRISP_WEBSITE_ID: ${CRISP_WEBSITE_ID}
    container_name: portfolio
    environment:
      - NEXT_PUBLIC_CRISP_WEBSITE_ID=${CRISP_WEBSITE_ID}
      - NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN=${NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN:-}
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "3036:80"
    networks:
      exitnode-bridge:
        ipv4_address: 172.31.255.2

  crisp-webhook:
    build: ./backend
    container_name: crisp_webhook
    restart: always
    ports:
      - "3111:3000"
    environment:
      - PORT=3000
      - CRISP_IDENTIFIER=${CRISP_IDENTIFIER}
      - CRISP_KEY=${CRISP_KEY}
      - CRISP_WEBSITE_ID=${CRISP_WEBSITE_ID}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    env_file:
      - .env
    networks:
      exitnode-bridge:
        ipv4_address: 172.31.255.3

  # -------------------------------------------------------------------------
  # chat-backend - custom (non-Crisp) chat widget backend.
  # Proxies the portfolio chat messages to the n8n webhook, keeping the
  # webhook credential server-side. Reached by the site through the nginx
  # /api/chat proxy at 172.31.255.2. Host port 3112.
  # -------------------------------------------------------------------------
  chat-backend:
    build: ./chat-backend
    container_name: chat_backend
    restart: always
    ports:
      - "3112:3000"
    environment:
      - PORT=3000
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - N8N_WEBHOOK_TOKEN=${N8N_WEBHOOK_TOKEN}
    env_file:
      - .env
    networks:
      exitnode-bridge:
        ipv4_address: 172.31.255.4

networks:
  exitnode-bridge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.255.0/24
          gateway: "172.31.255.1"