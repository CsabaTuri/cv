# ---------------------------------------------------------------------------
# Static site + reverse proxy for the chat API.
# Runs as the non-root user of nginxinc/nginx-unprivileged (port 8080).
# ---------------------------------------------------------------------------

# Keep the real client scheme when TLS terminates at the outer proxy/tunnel.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Throttle the API: the widget polls a few times per minute per visitor, so
# 20 r/s per IP is far above the legitimate rate and stops floods.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# The rebuild endpoint is a different animal: the panel polls it while a build
# runs, but nobody needs to hit it in a burst.
limit_req_zone $binary_remote_addr zone=build:10m rate=2r/s;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the server version, keep request handling bounded.
    server_tokens off;
    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;

    include /etc/nginx/security-headers.conf;

    # Container healthcheck endpoint.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # -----------------------------------------------------------------------
    # One-click rebuild endpoint -> deployer helper (opt-in `deploy` profile).
    #
    # This is the only path nginx sends somewhere else than chat-backend. The
    # helper needs the Docker socket, so it is kept in its own container; when
    # the profile is not running, the name does not resolve and nginx answers
    # 502, which the admin panel turns into the enable instructions.
    # -----------------------------------------------------------------------
    location ^~ /api/deploy/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $deployer http://deployer:4000;

        limit_req zone=build burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 1k;

        # Read-only: the panel only ever GETs the status and POSTs the trigger.
        if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) {
            return 405;
        }

        proxy_pass $deployer;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_hide_header X-Powered-By;

        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # -----------------------------------------------------------------------
    # Chat API (visitor widget + admin panel) -> chat-backend.
    #
    # The upstream is a variable so nginx resolves the service name through
    # Docker's DNS at request time: the backend can be recreated without
    # restarting this container, and no IP is hardcoded anywhere.
    # -----------------------------------------------------------------------
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $chat_backend http://chat-backend:3000;

        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;

        # The API is JSON over GET/POST/PUT/DELETE only (DELETE unsubscribes
        # from the push notifications).
        if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS)$) {
            return 405;
        }

        proxy_pass $chat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # Do not leak the application server's fingerprint.
        proxy_hide_header X-Powered-By;

        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # The service worker must never be cached long: a stale copy would keep
    # serving an old app shell. Same for the manifest, which also needs the
    # right content type (nginx does not know `webmanifest` by default).
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location = /manifest.webmanifest {
        types {
            application/manifest+json webmanifest;
        }
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Serve the exported 404 page for unknown paths (status stays 404).
    error_page 404 /404.html;

    # Long-lived caching for hashed static assets.
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|woff2?|ttf|eot|webp|avif|pdf)$ {
        expires 1y;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
