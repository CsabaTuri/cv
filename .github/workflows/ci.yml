# ---------------------------------------------------------------------------
# CI: everything that has to hold before something reaches the host.
#
#   lint   - ESLint and Prettier over the whole repository
#   site   - TypeScript + the static export, including the PWA files
#   api    - the test suite against a real MySQL (the same shape as the stack),
#            on the runtime version and the current LTS
#   e2e    - Playwright against the real thing: the exported site, the real
#            backend and a real MySQL, with nothing mocked
#   docker - the compose files and the images themselves, plus the guard that
#            the stack refuses to start without its secrets
#   publish- the images, built once the tests are green, pushed to the GitHub
#            container registry so a host can pull them instead of building
#   summary- collects the reports of the jobs above into one summary, so the
#            run page shows the whole suite in one place, and renders the Allure
#            dashboard from them (published to GitHub Pages when it is enabled)
#
# The tests live in tests/ and need no dependencies: `node --test` with the
# standard library only. Run them locally with:
#
#   npm ci --prefix chat-backend
#   DB_HOST=127.0.0.1 DB_PORT=3306 DB_NAME=cv_chat_test \
#   DB_USER=chat DB_PASSWORD=chat ADMIN_TOKEN=ci-admin-token \
#     node --test tests/*.test.mjs
#
# The api and e2e jobs each report their own results, and the summary job at the
# end joins them: the run page shows the total of everything that ran.
#
# Results are reported three ways, all of them without extra tooling:
#   * the run summary (markdown written to $GITHUB_STEP_SUMMARY)
#   * a downloadable artifact (the JUnit XML and that markdown)
#   * a comment on the pull request, updated in place on every push
# .github/scripts/test-summary.mjs builds the markdown out of the JUnit XML that
# `node --test` and Playwright both write; .github/scripts/pr-comment.sh posts
# it, one comment per report, marked so the jobs never overwrite each other.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the tooling
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  site:
    name: Site (typecheck + static export)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cv

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cv/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build the static export
        run: npm run build

      - name: The export carries the app shell and the PWA files
        run: |
          for file in index.html admin/index.html 404.html sw.js manifest.webmanifest \
                      icons/icon-192.png icons/icon-512.png apple-touch-icon.png; do
            test -f "out/$file" || { echo "missing from the export: $file"; exit 1; }
          done
          grep -q 'rel="manifest"' out/index.html

  api:
    name: API (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Only for the report comment; forks get a read-only token, and the step
      # is allowed to fail there instead of failing the job.
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        # 20 is what the images run, 22 is the current release.
        node: ['20', '22']

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cv_chat_test
          MYSQL_USER: chat
          MYSQL_PASSWORD: chat
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: cv_chat_test
      DB_USER: chat
      DB_PASSWORD: chat
      ADMIN_TOKEN: ci-admin-token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: chat-backend/package-lock.json

      - name: Install the backend dependencies
        run: npm ci --prefix chat-backend

      - name: Syntax check every service
        run: |
          node --check chat-backend/server.js
          node --check chat-backend/push.js
          node --check chat-backend/content.js
          node --check deployer/deployer.js
          node --check cv/public/sw.js
          node --check .github/scripts/test-summary.mjs

      - name: Tests (API, content catalogue, assets, compose guards)
        run: |
          mkdir -p test-results
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=test-results/junit.xml \
            tests/*.test.mjs

      # Everything below runs even when the tests failed - that is the point of
      # a report. None of these steps may fail the job either: the test step
      # above already decides the outcome.
      - name: Test report (run summary + pull request body)
        if: always()
        run: |
          node .github/scripts/test-summary.mjs test-results/junit.xml \
            --title "API (Node ${{ matrix.node }})" \
            --out test-results/summary.md

      - name: Test report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node }}
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Test report (pull request comment)
        if: always() && github.event_name == 'pull_request' && matrix.node == '22'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
        run: |
          {
            cat test-results/summary.md 2>/dev/null \
              || printf '## 🧪 Test report\n\n⚠️ The report could not be generated - see the job log.\n'
            printf '\n[Full log and artifacts](%s/%s/actions/runs/%s)\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > test-results/comment.md
          bash .github/scripts/pr-comment.sh cv-ci-report:unit test-results/comment.md

  e2e:
    name: End to end (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # Only for the report comment; a fork gets a read-only token, and the step
      # is allowed to fail there.
      pull-requests: write

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cv_chat_test
          MYSQL_USER: chat
          MYSQL_PASSWORD: chat
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: cv_chat_test
      DB_USER: chat
      DB_PASSWORD: chat
      ADMIN_TOKEN: ci-admin-token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cv/package-lock.json
            chat-backend/package-lock.json

      - name: Install the tooling and the backend
        run: |
          npm ci
          npm ci --prefix chat-backend

      - name: Install the site dependencies
        run: npm ci --prefix cv

      # The tests serve the real export, the way nginx does in production.
      - name: Build the static export
        run: npm --prefix cv run build

      # The runner image ships Chrome, and with it the shared libraries Chromium
      # needs, so the browser download is the only part left. `--with-deps` would
      # pull ~80 MB of fonts through apt on every single run - the slowest step
      # here, and the one that has hung. The download itself is cached, keyed on
      # the lockfile, so a Playwright upgrade starts from an empty cache.
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        timeout-minutes: 6
        run: npx playwright install chromium

      - name: End-to-end tests
        run: npx playwright test

      # The report steps run even when the tests failed - that is the point of a
      # report - and none of them may fail the job: the step above decides.
      - name: Test report (run summary + pull request body)
        if: always()
        run: |
          node .github/scripts/test-summary.mjs test-results/playwright-junit.xml \
            --title "End to end (Chromium)" \
            --out test-results/summary.md

      - name: Test report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
            allure-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Test report (pull request comment)
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
        run: |
          {
            cat test-results/summary.md 2>/dev/null \
              || printf '## 🧪 End to end\n\n⚠️ The report could not be generated - see the job log.\n'
            printf '\n[Full log, traces and screenshots](%s/%s/actions/runs/%s)\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > test-results/comment.md
          bash .github/scripts/pr-comment.sh cv-ci-report:e2e test-results/comment.md

  # Everything tested and green, so the images that were just built are worth
  # keeping: one immutable tag per commit, pushed to ghcr.io. The stack on the
  # host can then pull instead of building (set IMAGE_TAG_* in its .env to the
  # published tag); nothing here changes how a local build works.
  publish:
    name: Publish the images
    needs: [lint, site, api, e2e, docker]
    # Only from main: a pull request must never publish anything.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The same environment the docker job builds with. The tags are thrown
      # away below: what is published is the commit, never a floating tag.
      - name: Compose environment for CI
        run: |
          cp .env.example .env
          sed -i 's/^MYSQL_PASSWORD=$/MYSQL_PASSWORD=ci-password/' .env
          sed -i 's/^MYSQL_ROOT_PASSWORD=$/MYSQL_ROOT_PASSWORD=ci-root-password/' .env
          sed -i 's/^ADMIN_TOKEN=$/ADMIN_TOKEN=ci-admin-token/' .env
          sed -i 's/^IMAGE_TAG_CV=.*/IMAGE_TAG_CV=ci/' .env
          sed -i 's/^IMAGE_TAG_CHAT_BACKEND=.*/IMAGE_TAG_CHAT_BACKEND=ci/' .env
          sed -i 's/^IMAGE_TAG_DEPLOYER=.*/IMAGE_TAG_DEPLOYER=ci/' .env

      - name: Log in to the container registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Built through the compose files, so the build arguments (the analytics
      # token, the Dockerfiles, the contexts) are the ones the stack uses.
      - name: Build the images
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml build

      - name: Push them with the tag of this commit
        run: |
          # Must match the registry prefix in docker-compose.yml.
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          tag="sha-$(git rev-parse --short=7 HEAD)"

          for name in cv-web cv-chat-backend cv-deployer; do
            docker tag "${registry}/${name}:ci" "${registry}/${name}:${tag}"
            docker push "${registry}/${name}:${tag}"
          done

          {
            printf '## 📦 Published images\n\n'
            printf 'The whole suite passed, so this commit is available as:\n\n'
            for name in cv-web cv-chat-backend cv-deployer; do
              printf -- '- `%s/%s:%s`\n' "$registry" "$name" "$tag"
            done
            printf '\nPull them on a host by setting the three `IMAGE_TAG_*` values in its `.env` to `%s` and running `docker compose pull`.\n' "$tag"
          } >> "$GITHUB_STEP_SUMMARY"

  # The reports of the jobs above, collected into one summary. The unit suite
  # runs on two Node versions, so the Node 22 report is the one that is joined:
  # counting the same tests twice would only make the total confusing.
  summary:
    name: Test summary
    needs: [api, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Publishing the Allure report to GitHub Pages needs both.
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # The Allure CLI is a Java program, so make sure there is one.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the tooling
        run: npm ci

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-results-node-22
          path: reports/unit

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: playwright-report
          path: reports/e2e

      - name: One summary for the whole suite
        run: |
          # Whatever the artifacts happen to contain, the JUnit reports are the
          # ones to join. Nothing to join (a job failed before it reported) is
          # not an error here: this step only writes the summary.
          mapfile -t reports < <(find reports -type f -name '*junit.xml' | sort)
          if [ "${#reports[@]}" -eq 0 ]; then
            printf '## 🧪 Test summary\n\n⚠️ No report was uploaded - see the jobs above.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node .github/scripts/test-summary.mjs "${reports[@]}" \
            --title "All tests (unit on Node 22 + end to end)"

      # One Allure dashboard for everything: the unit suite is converted from the
      # same JUnit XML, the Playwright results were written by the e2e job.
      # The unit suite is folded into the same results folder the e2e job wrote
      # its Playwright results into, so one dashboard covers everything.
      - name: Allure report
        if: always()
        run: |
          # The Playwright results come out of the e2e artifact; the unit results
          # are converted into the very same folder below.
          if [ -d reports/e2e/allure-results ]; then
            mkdir -p allure-results
            cp -a reports/e2e/allure-results/. allure-results/
          fi

          mapfile -t unit < <(find reports/unit -type f -name '*junit.xml' | sort)
          if [ "${#unit[@]}" -gt 0 ]; then
            node tests/allure-from-junit.mjs "${unit[@]}" \
              --parent "Unit tests (Node 22)" --out allure-results
          else
            echo "no unit report was uploaded"
          fi

          if [ -d allure-results ]; then
            npm run allure:generate
          else
            echo "nothing to render - writing a placeholder report instead"
            mkdir -p allure-report
            printf '<!doctype html><meta charset="utf-8"><title>No report</title><p>No test results were uploaded.\n' \
              > allure-report/index.html
          fi

      - name: Allure report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
          if-no-files-found: warn

      # Browsable without downloading anything. Pages has to be enabled for the
      # repository (Settings -> Pages -> Source: GitHub Actions) and, on a
      # private repository, only plans with Pages included provide it - if it is
      # not available, the steps below say so and the artifact is still there.
      - name: Prepare GitHub Pages
        id: pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the report for Pages
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Publish the report
        id: deploy
        if: steps.pages.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Where to find the reports
        if: always()
        run: |
          {
            printf '\n### Reports\n\n'
            printf -- '- Summary: above, on this page\n'
            printf -- '- Allure dashboard: the `allure-report` artifact, unzip and open `index.html`\n'
            if [ -n "${{ steps.deploy.outputs.page_url }}" ]; then
              printf -- '- Allure dashboard online: %s\n' "${{ steps.deploy.outputs.page_url }}"
            else
              printf -- '- Allure dashboard online: not published (GitHub Pages is not enabled for this repository)\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Compose files and images
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Compose environment for CI
        run: |
          cp .env.example .env
          sed -i 's/^MYSQL_PASSWORD=$/MYSQL_PASSWORD=ci-password/' .env
          sed -i 's/^MYSQL_ROOT_PASSWORD=$/MYSQL_ROOT_PASSWORD=ci-root-password/' .env
          sed -i 's/^ADMIN_TOKEN=$/ADMIN_TOKEN=ci-admin-token/' .env
          sed -i 's/^IMAGE_TAG_CV=.*/IMAGE_TAG_CV=ci/' .env
          sed -i 's/^IMAGE_TAG_CHAT_BACKEND=.*/IMAGE_TAG_CHAT_BACKEND=ci/' .env
          sed -i 's/^IMAGE_TAG_DEPLOYER=.*/IMAGE_TAG_DEPLOYER=ci/' .env

      - name: Both overlays are valid
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q

      - name: The stack refuses to start without secrets
        run: |
          mv .env .env.ci
          if docker compose -f docker-compose.yml config -q >/dev/null 2>&1; then
            echo "compose accepted a missing .env, the fail-fast is gone"
            exit 1
          fi
          mv .env.ci .env

      - name: Build the images
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml build

      - name: The images carry the requested tags
        run: |
          for image in cv-web:ci cv-chat-backend:ci cv-deployer:ci; do
            docker image inspect "$image" >/dev/null
          done

      - name: nginx accepts the configuration
        run: docker run --rm --entrypoint nginx cv-web:ci -t

      - name: The backend image ships the push module
        run: |
          docker run --rm --entrypoint node cv-chat-backend:ci \
            -e "require('web-push'); console.log('web-push loads')"
